name: Java CI with Maven - DEBUG

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./ingka-java-code-assignment

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quarkus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build with Maven
      run: ./mvnw clean compile -B

    - name: DEBUG - Check JaCoCo plugin configuration
      run: |
        echo "=== Checking pom.xml for JaCoCo configuration ==="
        grep -A 20 "jacoco-maven-plugin" pom.xml || echo "JaCoCo plugin not found!"
        echo ""
        echo "=== Checking Surefire configuration ==="
        grep -A 10 "maven-surefire-plugin" pom.xml || echo "Surefire plugin not found!"

    - name: Run tests with verbose JaCoCo
      run: |
        echo "=== Running tests with JaCoCo ==="
        ./mvnw clean test -B -X 2>&1 | grep -E "(jacoco|argLine|agent)" || true
        echo ""
        echo "=== Checking if jacoco.exec was created ==="
        ls -lh target/jacoco.exec 2>/dev/null || echo "jacoco.exec NOT FOUND!"
        if [ -f target/jacoco.exec ]; then
          echo "jacoco.exec size: $(stat -f%z target/jacoco.exec 2>/dev/null || stat -c%s target/jacoco.exec)"
        fi
      env:
        QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/quarkus_test
        QUARKUS_DATASOURCE_USERNAME: postgres
        QUARKUS_DATASOURCE_PASSWORD: root

    - name: Generate JaCoCo report
      run: ./mvnw jacoco:report -B

    - name: DEBUG - Check generated files
      run: |
        echo "=== Files in target/ ==="
        ls -lh target/ | head -20
        echo ""
        echo "=== Files in target/site/jacoco/ ==="
        ls -lh target/site/jacoco/ 2>/dev/null || echo "jacoco directory not found!"
        echo ""
        if [ -f target/site/jacoco/index.html ]; then
          echo "=== First 100 lines of index.html ==="
          head -100 target/site/jacoco/index.html
          echo ""
          echo "=== Searching for Total row ==="
          grep -A 5 "Total" target/site/jacoco/index.html || echo "Total row not found!"
        fi

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ingka-java-code-assignment/target/surefire-reports/
        retention-days: 30

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: ingka-java-code-assignment/target/site/jacoco/
        retention-days: 30

    - name: Upload jacoco.exec for inspection
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-exec
        path: ingka-java-code-assignment/target/jacoco.exec
        retention-days: 7

    - name: Extract Coverage Percentage
      id: coverage
      run: |
        echo "Extracting coverage from JaCoCo report..."
        
        if [ -f "target/site/jacoco/index.html" ]; then
          COVERAGE=$(sed -n '/<td>Total<\/td>/,/<\/tr>/p' target/site/jacoco/index.html | grep -oE '[0-9]+%' | head -1 | grep -oE '[0-9]+')
          
          if [ -n "$COVERAGE" ]; then
            echo "Successfully extracted coverage: $COVERAGE%"
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "Could not extract coverage"
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi
        else
          echo "index.html not found"
          echo "coverage=0" >> $GITHUB_OUTPUT
        fi

    - name: Check Coverage Threshold
      run: |
        COVERAGE=${{ steps.coverage.outputs.coverage }}
        THRESHOLD=70
        
        echo "Coverage: $COVERAGE%"
        echo "Threshold: $THRESHOLD%"
        
        if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
          echo "Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          echo "THIS IS EXPECTED DURING DEBUGGING - NOT FAILING THE BUILD"
          echo "Check the debug outputs above to see what's wrong"
        else
          echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi

    - name: Package application
      run: ./mvnw package -DskipTests -B

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: ingka-java-code-assignment/target/*.jar
        retention-days: 7

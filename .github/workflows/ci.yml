name: Java CI with Maven

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    # Set working directory to the project folder
    defaults:
      run:
        working-directory: ./ingka-java-code-assignment

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quarkus_test     # Match your application.properties
          POSTGRES_USER: postgres        # Match your application.properties
          POSTGRES_PASSWORD: root        # Match your application.properties
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build with Maven
      run: ./mvnw clean compile -B

    - name: Run tests
      run: ./mvnw test -B
      env:
        # These match your application.properties
        QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/quarkus_test
        QUARKUS_DATASOURCE_USERNAME: postgres
        QUARKUS_DATASOURCE_PASSWORD: root

    - name: Generate JaCoCo Coverage Report
      run: ./mvnw jacoco:report -B

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ingka-java-code-assignment/target/surefire-reports/
        retention-days: 30

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: ingka-java-code-assignment/target/site/jacoco/
        retention-days: 30

    - name: Extract Coverage Percentage
      id: coverage
      run: |
        echo "Extracting coverage from JaCoCo HTML report..."
        
        if [ ! -f "target/site/jacoco/index.html" ]; then
          echo "index.html not found!"
          ls -la target/site/jacoco/ || echo "jacoco directory doesn't exist"
          echo "coverage=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        # Extract the instruction coverage percentage from the Total row in index.html
        # The HTML contains: <td class="ctr2">88%</td> in the Total row
        COVERAGE=$(grep -A 50 '>Total<' target/site/jacoco/index.html | grep -oP 'class="ctr2">\K\d+(?=%)' | head -1)
        
        if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "0" ]; then
          echo "Found coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        else
          echo "Could not extract coverage, trying alternative method..."
          
          # Alternative: Look for percentage in any part of the Total section
          COVERAGE=$(grep -oP 'Total[^<]*<[^>]*>\s*\K\d+(?=%)' target/site/jacoco/index.html | head -1)
          
          if [ -n "$COVERAGE" ]; then
            echo "Found coverage (alternative): $COVERAGE%"
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "Could not extract coverage from HTML"
            echo "coverage=0" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = '${{ steps.coverage.outputs.coverage }}';
          const comment = `## Test Coverage Report
          
          **Coverage:** ${coverage}%
          
           Full JaCoCo report available in workflow artifacts.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Check Coverage Threshold
      run: |
        COVERAGE=${{ steps.coverage.outputs.coverage }}
        THRESHOLD=70
        if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
          echo "Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          exit 1
        else
          echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi

    - name: Package application
      run: ./mvnw package -DskipTests -B

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: ingka-java-code-assignment/target/*.jar
        retention-days: 7

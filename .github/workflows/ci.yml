name: Java CI with Maven

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    # Set working directory to the project folder
    defaults:
      run:
        working-directory: ./ingka-java-code-assignment

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: quarkus_test     # Match your application.properties
          POSTGRES_USER: postgres        # Match your application.properties
          POSTGRES_PASSWORD: root        # Match your application.properties
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Make mvnw executable
      run: chmod +x ./mvnw

    - name: Build with Maven
      run: ./mvnw clean compile -B

    - name: Run tests
      run: ./mvnw test -B
      env:
        # These match your application.properties
        QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/quarkus_test
        QUARKUS_DATASOURCE_USERNAME: postgres
        QUARKUS_DATASOURCE_PASSWORD: root

    - name: Generate JaCoCo Coverage Report
      run: ./mvnw jacoco:report -B

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ingka-java-code-assignment/target/surefire-reports/
        retention-days: 30

    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: ingka-java-code-assignment/target/site/jacoco/
        retention-days: 30

    - name: Extract Coverage Percentage
      id: coverage
      run: |
        echo "=== Debugging JaCoCo CSV ==="
        
        # Check if CSV exists
        if [ ! -f "target/site/jacoco/jacoco.csv" ]; then
          echo "jacoco.csv not found!"
          ls -la target/site/jacoco/ || echo "Directory doesn't exist"
          echo "coverage=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "Found jacoco.csv"
        
        # Show first few lines to understand format
        echo "First 5 lines of CSV:"
        head -5 target/site/jacoco/jacoco.csv
        
        # Method 1: Try standard JaCoCo CSV format (columns 4 and 5 are INSTRUCTION_MISSED and INSTRUCTION_COVERED)
        COVERAGE=$(awk -F',' '
          BEGIN { total_missed=0; total_covered=0 }
          NR > 1 {
            # Column 4 = INSTRUCTION_MISSED, Column 5 = INSTRUCTION_COVERED
            total_missed += $4
            total_covered += $5
          }
          END {
            total = total_missed + total_covered
            if (total > 0) {
              coverage = int((total_covered * 100) / total)
              print coverage
            } else {
              print 0
            }
          }
        ' target/site/jacoco/jacoco.csv)
        
        echo "Calculated coverage: $COVERAGE%"
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        
        # If still 0, try alternative method using index.html
        if [ "$COVERAGE" = "0" ]; then
          echo "CSV method returned 0, trying HTML parsing..."
          if [ -f "target/site/jacoco/index.html" ]; then
            # Extract percentage from HTML (more reliable)
            HTML_COVERAGE=$(grep -oP 'Total[^>]*>\s*\K\d+(?=%)' target/site/jacoco/index.html | head -1)
            if [ -n "$HTML_COVERAGE" ]; then
              echo "Found coverage from HTML: $HTML_COVERAGE%"
              echo "coverage=$HTML_COVERAGE" >> $GITHUB_OUTPUT
              COVERAGE=$HTML_COVERAGE
            fi
          fi
        fi

    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = '${{ steps.coverage.outputs.coverage }}';
          const comment = `## Test Coverage Report
          
          **Coverage:** ${coverage}%
          
           Full JaCoCo report available in workflow artifacts.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Check Coverage Threshold
      run: |
        COVERAGE=${{ steps.coverage.outputs.coverage }}
        THRESHOLD=70
        if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
          echo "Coverage ($COVERAGE%) is below threshold ($THRESHOLD%)"
          exit 1
        else
          echo "Coverage ($COVERAGE%) meets threshold ($THRESHOLD%)"
        fi

    - name: Package application
      run: ./mvnw package -DskipTests -B

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: ingka-java-code-assignment/target/*.jar
        retention-days: 7
